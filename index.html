<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BrainHub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand-row">
      <div class="brand-mark">🧠</div>
      <span class="brand-name">BrainHub</span>
    </div>
    <nav class="nav-scroll">
      <p class="nav-label">ワークスペース</p>
      <ul class="ws-list" id="wsList"></ul>
      <div id="wsAddForm" class="ws-add-form" style="display:none;">
        <input id="wsAddInput" class="ws-add-input" placeholder="ワークスペース名" />
      </div>
      <button class="ws-add-btn" id="wsAddBtn">＋ 新規追加</button>
    </nav>
    <div class="sidebar-footer">
      <div class="email">you@example.com</div>
      <button class="reset-link" id="resetBtn">すべてのデータを消去</button>
    </div>
  </aside>

  <main>
    <div class="page-head">
      <div class="brand-mark">🧠</div>
      <div>
        <h1>BrainHub</h1>
        <p id="pageSubtitle">あなた専用の第二の脳</p>
      </div>
    </div>

    <div class="card">
      <p class="search-label">✨ 何でも聞いてください</p>
      <div class="search-row">
        <input id="searchInput" class="search-input" placeholder="質問を入力してください" />
        <button id="searchBtn" class="search-submit" aria-label="検索">🔍</button>
      </div>
      <div id="answerBox" class="answer-box" style="display:none;">
        <p id="answerText"></p>
        <button class="answer-close" id="answerClose">閉じる</button>
      </div>
      <p id="searchHint" class="hint"></p>
    </div>

    <p class="section-title" id="listTitle">記憶の記録 (0)</p>
    <div id="listArea"></div>
  </main>
</div>

<button class="fab" id="fabBtn" aria-label="新しいメモを追加">＋</button>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <div>
        <h2>新しい記憶を書く</h2>
        <p class="modal-target">保存先: <span id="modalWsName"></span></p>
      </div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="field">
      <input id="memoTitle" placeholder="タイトル（任意）" />
    </div>
    <div class="field">
      <textarea id="memoContent" rows="5" placeholder="メモを書いてください。AIが自動でタグ付け・整理します。"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" id="modalCancel">キャンセル</button>
      <button class="btn-primary" id="modalSave">保存する</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
